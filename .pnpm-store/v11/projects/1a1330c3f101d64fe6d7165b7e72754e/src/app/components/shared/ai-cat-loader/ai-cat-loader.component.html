<div class="ai-cat-loader" role="status" aria-live="polite">
  <p class="ai-cat-loader__message">{{ currentMessage }}</p>
  <div class="ai-cat" aria-hidden="true">
    <div class="ai-cat__scene">
      <div class="ai-cat__ears"></div>
      <div class="ai-cat__head">
        <div class="ai-cat__eyes"></div>
        <div class="ai-cat__nose"></div>
      </div>
      <div class="ai-cat__body">
        <div class="ai-cat__paw ai-cat__paw--left"></div>
        <div class="ai-cat__paw ai-cat__paw--right"></div>
      </div>
      <div class="ai-cat__tail"></div>
      <div class="ai-cat__laptop">
        <div class="ai-cat__screen"></div>
        <div class="ai-cat__keyboard"></div>
      </div>
    </div>
  </div>
</div>
