<div class="eud" *ngIf="open" role="dialog" aria-modal="true" aria-label="Completar ubicación">
  <button type="button" class="eud__backdrop" (click)="closed.emit()" aria-label="Cerrar"></button>
  <aside class="eud__panel">
    <header class="eud__header">
      <div>
        <p class="eud__eyebrow">Ubicación pendiente</p>
        <h2>{{ group?.estacion_nombre || 'Estación' }}</h2>
        <p class="eud__meta" *ngIf="group">
          {{ group.empresa_nombre || 'Sin empresa' }}
          · {{ group.cantidad_pasadas }} pasadas
        </p>
      </div>
      <button type="button" class="eud__icon-btn" (click)="closed.emit()" aria-label="Cerrar panel">
        <i class="fas fa-times" aria-hidden="true"></i>
      </button>
    </header>

    <div class="eud__body">
      <div class="eud__badge-row">
        <span
          class="eud__badge"
          [class.eud__badge--ok]="badge === 'OK'"
          [class.eud__badge--pending]="badge === 'PENDING'"
        >
          {{ badge }}
        </span>
        <span class="eud__muted">Se marca OK al informar latitud y longitud</span>
      </div>

      <form class="eud__form" [formGroup]="form" (ngSubmit)="submit()">
        <div class="eud__row2">
          <label>
            Latitud
            <input type="number" step="any" formControlName="latitud" placeholder="-34.6037" />
          </label>
          <label>
            Longitud
            <input type="number" step="any" formControlName="longitud" placeholder="-58.3816" />
          </label>
        </div>
        <label>
          Camino
          <input type="text" formControlName="camino" placeholder="Ruta / colectora" />
        </label>
        <label>
          Ubicación
          <input type="text" formControlName="ubicacion" placeholder="Descripción breve" />
        </label>

        <p class="eud__error" *ngIf="error" role="alert">{{ error }}</p>

        <footer class="eud__actions">
          <button type="button" class="eud__btn eud__btn--ghost" (click)="closed.emit()">Cancelar</button>
          <button type="submit" class="eud__btn eud__btn--primary" [disabled]="saving || form.invalid">
            {{ saving ? 'Guardando…' : 'Guardar ubicación' }}
          </button>
        </footer>
      </form>
    </div>
  </aside>
</div>
