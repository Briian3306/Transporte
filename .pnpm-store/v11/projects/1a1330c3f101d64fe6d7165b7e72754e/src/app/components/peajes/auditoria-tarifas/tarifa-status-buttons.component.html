<div
  class="at__status-select"
  [attr.aria-label]="ariaLabel"
  [style.--at-status-color]="currentColor"
>
  <span
    class="at__status-dot"
    [class.at__status-dot--pending]="!hasSelection"
    aria-hidden="true"
  ></span>
  <app-search-select
    class="at__status-search"
    [options]="options"
    [value]="selectValue"
    [disabled]="disabled"
    [clearable]="true"
    [showAllWhenEmpty]="true"
    [maxResults]="20"
    placeholder="Buscar status (PICO, NO_PICO…)"
    emptyMessage="Sin estados que coincidan"
    (valueChange)="onValueChange($event)"
  ></app-search-select>
  <span *ngIf="!options.length" class="at__status-empty" role="status">
    No hay estados en el catálogo de este peaje
  </span>
</div>
