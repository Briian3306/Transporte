<section class="pf" aria-label="Filtros de pasadas">
  <div class="pf__grid">
    <app-date-range-picker
      class="pf__span-2"
      label="Rango de fechas"
      placeholder="Elegir fechas"
      [value]="dateRange"
      (valueChange)="onDateRange($event)"
    />

    <app-search-multi-select
      label="Estación"
      placeholder="Buscar estación…"
      [options]="estacionOptions"
      [value]="value.estacion_ids ?? []"
      (valueChange)="onEstaciones($event)"
    />

    <app-search-multi-select
      label="Patente"
      placeholder="Buscar patente…"
      [options]="patenteOptions"
      [value]="value.patente_ids ?? []"
      (valueChange)="onPatentes($event)"
    />

    <app-search-multi-select
      label="Empresa"
      placeholder="Buscar empresa…"
      [options]="empresaOptions"
      [value]="value.empresa_ids ?? []"
      (valueChange)="onEmpresas($event)"
    />

    <label class="pf__field">
      <span>Estado</span>
      <select disabled title="Próximamente" [ngModel]="value.statusStub ?? ''">
        <option value="">Todos (próximamente)</option>
      </select>
    </label>
  </div>
</section>
