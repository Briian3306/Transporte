<div class="drp" [class.drp--disabled]="disabled" [class.drp--error]="parseError">
  <label *ngIf="label" class="drp__label" [attr.for]="inputId || null">{{ label }}</label>

  <div class="drp__trigger-row">
    <div class="drp__field" *ngIf="allowTypedInput; else buttonTrigger">
      <i class="fas fa-calendar-alt" aria-hidden="true"></i>
      <input
        #dateInput
        type="text"
        class="drp__input"
        [id]="inputId || null"
        [value]="textDraft"
        [placeholder]="inputPlaceholder"
        [disabled]="disabled"
        autocomplete="off"
        inputmode="numeric"
        spellcheck="false"
        [attr.aria-invalid]="parseError"
        [attr.aria-expanded]="open"
        aria-haspopup="dialog"
        [attr.aria-label]="label || (isSingle ? 'Fecha' : 'Rango de fechas')"
        (input)="onTextInput($event)"
        (blur)="onTextBlur()"
        (keydown)="onTextKeydown($event)"
      />
      <button
        type="button"
        class="drp__cal-btn"
        [disabled]="disabled"
        tabindex="-1"
        aria-label="Abrir calendario"
        (click)="toggle()"
      >
        <i class="fas fa-caret-down" aria-hidden="true"></i>
      </button>
    </div>

    <ng-template #buttonTrigger>
      <button
        type="button"
        class="drp__trigger"
        [disabled]="disabled"
        [attr.aria-expanded]="open"
        aria-haspopup="dialog"
        (click)="toggle()"
      >
        <i class="fas fa-calendar-alt" aria-hidden="true"></i>
        <span class="drp__trigger-text" [class.drp__trigger-text--placeholder]="!value.from">
          {{ buttonLabel }}
        </span>
      </button>
    </ng-template>

    <button
      *ngIf="value.from && !disabled"
      type="button"
      class="drp__clear"
      aria-label="Limpiar fechas"
      (click)="clear($event)"
    >
      <i class="fas fa-times" aria-hidden="true"></i>
    </button>
  </div>

  <p class="drp__hint" *ngIf="parseError">Usá el formato dd/mm/aaaa{{ isSingle ? '' : ' – dd/mm/aaaa' }}</p>
  <p class="drp__hint drp__hint--quiet" *ngIf="allowTypedInput && !parseError && !value.from">
    Escribí {{ isSingle ? '13/6/2020' : '13/6/2020 – 20/6/2020' }} o Abrí el calendario con ↓
  </p>

  <div
    *ngIf="open"
    class="drp__popover"
    [class.drp__popover--single]="isSingle"
    role="dialog"
    [attr.aria-label]="isSingle ? 'Calendario' : 'Calendario de rango'"
  >
    <div class="drp__nav">
      <button type="button" class="drp__nav-btn" (click)="prevMonth()" aria-label="Mes anterior">
        <i class="fas fa-chevron-left" aria-hidden="true"></i>
      </button>
      <div class="drp__titles" [class.drp__titles--single]="isSingle">
        <strong>{{ leftMonthLabel }}</strong>
        <strong *ngIf="!isSingle">{{ rightMonthLabel }}</strong>
      </div>
      <button type="button" class="drp__nav-btn" (click)="nextMonth()" aria-label="Mes siguiente">
        <i class="fas fa-chevron-right" aria-hidden="true"></i>
      </button>
    </div>

    <div class="drp__months" [class.drp__months--single]="isSingle">
      <div class="drp__month">
        <div class="drp__weekdays">
          <span *ngFor="let w of weekdays">{{ w }}</span>
        </div>
        <div class="drp__grid">
          <button
            type="button"
            *ngFor="let day of leftDays"
            class="drp__day"
            [class.drp__day--muted]="!day.inMonth"
            [class.drp__day--start]="isStart(day)"
            [class.drp__day--end]="!isSingle && isEnd(day)"
            [class.drp__day--in-range]="!isSingle && inRange(day)"
            [class.drp__day--single]="isSingle && isStart(day)"
            [disabled]="day.disabled"
            (click)="selectDay(day)"
          >
            {{ day.date.getDate() }}
          </button>
        </div>
      </div>
      <div class="drp__month drp__month--right" *ngIf="!isSingle">
        <div class="drp__weekdays">
          <span *ngFor="let w of weekdays">{{ w }}</span>
        </div>
        <div class="drp__grid">
          <button
            type="button"
            *ngFor="let day of rightDays"
            class="drp__day"
            [class.drp__day--muted]="!day.inMonth"
            [class.drp__day--start]="isStart(day)"
            [class.drp__day--end]="isEnd(day)"
            [class.drp__day--in-range]="inRange(day)"
            [disabled]="day.disabled"
            (click)="selectDay(day)"
          >
            {{ day.date.getDate() }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
