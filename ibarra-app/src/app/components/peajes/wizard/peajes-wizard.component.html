<div class="pw">
  <div class="pw__intro">
    <div>
      <p class="pw__eyebrow">Peajes / nueva carga</p>
      <h1 class="pw__title">Automatiza una carga de pasadas.</h1>
      <p class="pw__lede">
        Transformá columnas del proveedor, relacioná estaciones y validá la factura antes de confirmar.
      </p>
    </div>
    <div class="pw__intro-actions">
      <div class="pw__run-note" *ngIf="state.snapshot().preview as p">
        <span class="pw__pulse" aria-hidden="true"></span>
        {{ p.nombreArchivo }} · {{ p.totalFilas }} registros
      </div>
      <button type="button" class="pw__btn pw__btn--ghost" (click)="reiniciar()">
        <i class="fas fa-undo" aria-hidden="true"></i>
        Reiniciar
      </button>
      <a routerLink="/peajes" class="pw__btn pw__btn--ghost">
        <i class="fas fa-arrow-left" aria-hidden="true"></i>
        Volver
      </a>
    </div>
  </div>

  <nav class="pw__stepper" aria-label="Pasos del asistente">
    <div class="pw__steps">
      <button
        type="button"
        class="pw__step"
        *ngFor="let p of pasos"
        [class.pw__step--active]="p.id === pasoActual"
        [class.pw__step--done]="p.id < pasoActual"
        [disabled]="p.id > pasoActual && !puedeAvanzarA(p.id)"
        (click)="irA(p.id)"
      >
        <span class="pw__step-row">
          <span class="pw__step-num">
            <ng-container *ngIf="p.id < pasoActual; else num">✓</ng-container>
            <ng-template #num>{{ p.id }}</ng-template>
          </span>
          <span class="pw__step-label">{{ p.label }}</span>
        </span>
      </button>
    </div>
  </nav>

  <section class="pw__card fade-in" [attr.data-paso]="pasoActual">
    <app-paso1-carga *ngIf="pasoActual === 1" (completado)="siguiente()" />
    <app-paso2-preview *ngIf="pasoActual === 2" (completado)="siguiente()" (atras)="atras()" />
    <app-paso3-transformaciones *ngIf="pasoActual === 3" (completado)="siguiente()" (atras)="atras()" />
    <app-paso4-plantilla *ngIf="pasoActual === 4" (completado)="siguiente()" (facturaDirecta)="state.setPaso(7)" (atras)="atras()" />
    <app-paso5-mapeo *ngIf="pasoActual === 5" (completado)="siguiente()" (atras)="atras()" />
    <app-paso6-estaciones *ngIf="pasoActual === 6" (completado)="siguiente()" (atras)="atras()" />
    <app-paso7-factura *ngIf="pasoActual === 7" (completado)="siguiente()" (atras)="atras()" />
    <app-paso8-validacion *ngIf="pasoActual === 8" (completado)="siguiente()" (atras)="atras()" (irAPaso)="state.setPaso($event)" />
    <app-paso9-revision *ngIf="pasoActual === 9" (atras)="atras()" (reiniciar)="reiniciar()" />
  </section>
</div>
