<div class="paso7">
  <h2>Paso 7 — Información de factura</h2>
  <p class="paso7__hint">Completá los datos de la factura asociada a esta carga (ingreso manual MVP).</p>

  <form [formGroup]="form" class="pw__form-grid" (ngSubmit)="continuar()">
    <div class="pw__field">
      <label for="factura">Número de factura *</label>
      <input id="factura" formControlName="factura" />
      <div class="pw__field-error" *ngIf="invalid('factura')">Obligatorio</div>
    </div>
    <div class="pw__field">
      <label for="cuenta">Cuenta *</label>
      <input id="cuenta" formControlName="cuenta" />
      <div class="pw__field-error" *ngIf="invalid('cuenta')">Obligatorio</div>
    </div>
    <div class="pw__field">
      <label for="empresa_id">Empresa *</label>
      <input id="empresa_id" formControlName="empresa_id" placeholder="ID empresa" />
      <div class="pw__field-error" *ngIf="invalid('empresa_id')">Obligatorio</div>
    </div>
    <div class="pw__field">
      <label for="fecha_factura">Fecha de factura *</label>
      <input id="fecha_factura" type="date" formControlName="fecha_factura" />
      <div class="pw__field-error" *ngIf="invalid('fecha_factura')">Obligatorio</div>
    </div>
    <div class="pw__field">
      <label for="importe_sin_iva">Importe sin IVA *</label>
      <input id="importe_sin_iva" type="number" step="0.01" formControlName="importe_sin_iva" />
      <div class="pw__field-error" *ngIf="invalid('importe_sin_iva')">Obligatorio</div>
    </div>
    <div class="pw__field">
      <label for="importe_total">Importe total *</label>
      <input id="importe_total" type="number" step="0.01" formControlName="importe_total" />
      <div class="pw__field-error" *ngIf="invalid('importe_total')">Obligatorio</div>
    </div>
  </form>

  <div class="pw__actions">
    <button type="button" class="pw__btn pw__btn--ghost" (click)="atras.emit()">
      <i class="fas fa-arrow-left" aria-hidden="true"></i>
      Atrás
    </button>
    <button type="button" class="pw__btn pw__btn--primary" (click)="continuar()">
      Continuar
      <i class="fas fa-arrow-right" aria-hidden="true"></i>
    </button>
  </div>
</div>
