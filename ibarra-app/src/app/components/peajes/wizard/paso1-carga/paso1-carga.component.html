<div class="paso1">
  <h2>Paso 1 — Cargar archivo Excel</h2>
  <p class="paso1__hint">Arrastrá o seleccioná un archivo <strong>.xlsx</strong> con pasadas históricas.</p>

  <label
    class="pw__drop"
    [class.pw__drop--active]="dragOver"
    (drop)="onDrop($event)"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
  >
    <div class="pw__drop-icon"><i class="fas fa-cloud-upload-alt" aria-hidden="true"></i></div>
    <p>Soltá el archivo aquí o hacé clic para elegir</p>
    <input type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" (change)="onFileInput($event)" />
  </label>

  <div class="pw__alert pw__alert--error" *ngIf="error" role="alert">{{ error }}</div>
  <div class="pw__alert pw__alert--info" *ngIf="cargando">Procesando archivo…</div>

  <div class="pw__meta" *ngIf="meta">
    <span><strong>Archivo:</strong> {{ meta.nombreArchivo }}</span>
    <span><strong>Tamaño:</strong> {{ meta.tamanioBytes | number }} bytes</span>
    <span><strong>Filas:</strong> {{ meta.totalFilas }}</span>
    <span><strong>Columnas:</strong> {{ meta.columnas.length }}</span>
  </div>

  <div class="pw__actions">
    <span></span>
    <button type="button" class="pw__btn pw__btn--primary" [disabled]="!meta || cargando" (click)="continuar()">
      Continuar
      <i class="fas fa-arrow-right" aria-hidden="true"></i>
    </button>
  </div>
</div>
