<div class="paso3">
  <h2>Paso 3 — Transformaciones</h2>
  <p class="paso3__hint">
    Se consume <code>PeajesMotorTransformacion</code> (agente 03). No hay Strategy duplicada en el wizard.
  </p>

  <div class="pw__alert pw__alert--info">{{ mensaje }}</div>

  <div class="pw__alert pw__alert--error" *ngIf="errores.length" role="alert">
    <div *ngFor="let e of errores">{{ e.columna }}: {{ e.motivo }}</div>
  </div>

  <div class="pw__table-wrap" *ngIf="previewFilas.length">
    <table class="pw__table">
      <thead>
        <tr>
          <th>#</th>
          <th *ngFor="let col of state.columnasParaMapeo()">{{ col }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let fila of previewFilas; let i = index">
          <td>{{ i + 1 }}</td>
          <td *ngFor="let col of state.columnasParaMapeo()">{{ fila[col] }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="pw__actions">
    <button type="button" class="pw__btn pw__btn--ghost" (click)="atras.emit()">
      <i class="fas fa-arrow-left" aria-hidden="true"></i>
      Atrás
    </button>
    <button type="button" class="pw__btn pw__btn--primary" (click)="continuar()">
      Continuar
      <i class="fas fa-arrow-right" aria-hidden="true"></i>
    </button>
  </div>
</div>
