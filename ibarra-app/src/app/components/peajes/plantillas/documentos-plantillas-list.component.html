<section class="plt__panel plt__documents" aria-label="Documentos">
  <div class="plt__documents-head">
    <div><h2>Documentos</h2><p class="plt__muted">Consultá facturas y notas de crédito asociadas a las cargas de peajes.</p></div>
    <span class="plt__badge">{{ total }} registros</span>
  </div>
  <div class="plt__documents-filters">
    <app-date-range-picker label="Fecha del documento" placeholder="Elegir fechas" [value]="dateRange" (valueChange)="onDateRange($event)" />
    <app-search-multi-select label="Empresa" placeholder="Buscar empresa…" [options]="empresaOptions" [value]="filters.empresa_ids ?? []" (valueChange)="onEmpresas($event)" />
    <label class="plt__field"><span>Factura / documento</span><input type="search" [ngModel]="filters.factura ?? ''" (ngModelChange)="onFactura($event)" placeholder="Buscar número…" /></label>
    <label class="plt__field"><span>Tipo</span><select [ngModel]="filters.tipo ?? ''" (ngModelChange)="onTipo($event)"><option value="">Todos</option><option *ngFor="let tipo of tipos" [value]="tipo">{{ tipo }}</option></select></label>
  </div>
  <p class="plt__alert plt__alert--error" *ngIf="error" role="alert">{{ error }}</p>
  <app-data-table [columns]="columns" [rows]="tableRows" [loading]="loading" [page]="page" [pageSize]="pageSize" [total]="total" emptyMessage="No hay documentos con estos filtros." [exportLabel]="''" (pageChange)="onPageChange($event)">
    <ng-template appDataTableColumn="fecha_factura" let-row><span class="plt__mono">{{ row['fecha_factura'] || '—' }}</span></ng-template>
    <ng-template appDataTableColumn="empresa_nombre" let-row>{{ row['empresa_nombre'] || '—' }}</ng-template>
    <ng-template appDataTableColumn="importe_total" let-row><strong>{{ (row['importe_total'] ?? 0) | number:'1.2-2' }}</strong></ng-template>
  </app-data-table>
</section>
