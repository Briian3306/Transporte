<div class="cat">
  <header class="cat__header">
    <h1><i class="fas fa-road" aria-hidden="true"></i> Catálogo de peajes</h1>
    <a routerLink="/peajes/catalogos" class="cat__back">Volver a catálogos</a>
  </header>

  <div class="cat__layout">
    <section class="cat__panel">
      <h2>{{ editandoId ? 'Editar peaje' : 'Nuevo peaje' }}</h2>
      <form [formGroup]="form" class="cat__form" (ngSubmit)="guardar()">
        <label>Nombre *<input formControlName="nombre" /></label>
        <label>Ubicación<input formControlName="ubicacion" /></label>
        <label>Descripción<input formControlName="descripcion" /></label>
        <label>Empresa ID<input formControlName="empresa_id" /></label>
        <div class="cat__actions">
          <button type="button" (click)="nuevo()">Limpiar</button>
          <button type="submit" [disabled]="guardando">Guardar</button>
        </div>
      </form>
      <p class="cat__error" *ngIf="error">{{ error }}</p>
      <p class="cat__note">Usa mock tipado hasta que F01-1 entregue el servicio real.</p>
    </section>

    <section class="cat__panel">
      <div class="cat__list-head">
        <h2>Listado</h2>
        <label class="cat__filter">
          Filtrar
          <input
            type="search"
            [(ngModel)]="filtro"
            name="filtroPeajes"
            placeholder="Nombre, ubicación o ID…"
          />
        </label>
      </div>
      <table class="cat__table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Ubicación</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of peajesFiltrados">
            <td>{{ p.id }}</td>
            <td>{{ p.nombre }}</td>
            <td>{{ p.ubicacion || '—' }}</td>
            <td><button type="button" (click)="editar(p)">Editar</button></td>
          </tr>
          <tr *ngIf="!peajesFiltrados.length">
            <td colspan="4" class="cat__empty">Sin resultados para el filtro.</td>
          </tr>
        </tbody>
      </table>
    </section>
  </div>
</div>
