<div class="pc-home">
  <header class="pc-home__header">
    <div>
      <p class="pc-home__eyebrow">Módulo Peajes</p>
      <h1><i class="fas fa-map-marker-alt" aria-hidden="true"></i> Catálogos</h1>
      <p>Administrá peajes, estaciones, patentes y pases.</p>
    </div>
    <a routerLink="/peajes" class="pw__btn pw__btn--ghost">
      <i class="fas fa-arrow-left" aria-hidden="true"></i>
      Volver
    </a>
  </header>

  <section class="pc-home__grid">
    <a routerLink="peajes" class="pc-home__card">
      <div class="pc-home__icon"><i class="fas fa-road" aria-hidden="true"></i></div>
      <h2>Peajes</h2>
      <p>Alta y edición del catálogo de peajes.</p>
    </a>
    <a routerLink="estaciones" class="pc-home__card">
      <div class="pc-home__icon"><i class="fas fa-map-pin" aria-hidden="true"></i></div>
      <h2>Estaciones</h2>
      <p>Estaciones por peaje y códigos de proveedor.</p>
    </a>
    <a routerLink="patentes" class="pc-home__card">
      <div class="pc-home__icon"><i class="fas fa-car" aria-hidden="true"></i></div>
      <h2>Patentes</h2>
      <p>Dominios / patentes y categoría interna.</p>
    </a>
    <a routerLink="pases" class="pc-home__card">
      <div class="pc-home__icon"><i class="fas fa-id-card" aria-hidden="true"></i></div>
      <h2>Pases</h2>
      <p>Dispositivos / pases asociados a patentes.</p>
    </a>
