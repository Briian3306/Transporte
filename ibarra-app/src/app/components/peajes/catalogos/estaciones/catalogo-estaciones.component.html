<div class="cat">
  <header class="cat__header">
    <h1><i class="fas fa-map-pin" aria-hidden="true"></i> Catálogo de estaciones</h1>
    <a routerLink="/peajes/catalogos" class="cat__back">Volver a catálogos</a>
  </header>

  <div class="cat__layout">
    <section class="cat__panel">
      <div class="est__form-title">
        <span>{{ editandoId ? 'Editar estación' : 'Nueva estación' }}</span>
        <small *ngIf="editandoId">Edición activa</small>
      </div>
      <form [formGroup]="form" class="cat__form" (ngSubmit)="guardar()">
        <label>
          Peaje *
          <select formControlName="peaje_id">
            <option value="">Seleccionar…</option>
            <option *ngFor="let p of peajes" [value]="p.id">{{ p.nombre }}</option>
          </select>
        </label>
        <label>Nombre *<input formControlName="nombre" /></label>
        <label>Ubicación<input formControlName="ubicacion" /></label>
        <label>Descripción<input formControlName="descripcion" /></label>
        <label>Códigos proveedor (coma)<input formControlName="codigos_proveedor" placeholder="3, EST-3" /></label>
        <div class="est__geo">
          <label>Latitud<input type="number" step="any" formControlName="latitud" /></label>
          <label>Longitud<input type="number" step="any" formControlName="longitud" /></label>
        </div>
        <label>Camino / corredor<input formControlName="camino" placeholder="Ej.: COLECTORAS" /></label>
        <div class="cat__actions">
          <button type="submit" [disabled]="guardando">
            {{ guardando ? 'Guardando…' : editandoId ? 'Guardar cambios' : 'Crear estación' }}
          </button>
          <button type="button" *ngIf="editandoId" (click)="cancelarEdicion()">Cancelar</button>
        </div>
      </form>
      <p class="cat__error" *ngIf="error">{{ error }}</p>

      <h2 style="margin-top: 1.25rem">Sugerir por código/nombre</h2>
      <div class="cat__form">
        <label>
          Búsqueda
          <input [(ngModel)]="busqueda" name="busqueda" (keyup.enter)="sugerir()" />
        </label>
        <div class="cat__actions">
          <button type="button" (click)="sugerir()">Buscar</button>
        </div>
      </div>
      <ul *ngIf="sugeridas.length">
        <li *ngFor="let s of sugeridas">{{ s.nombre }} ({{ s.id }}) — peaje {{ s.peaje_id }}</li>
      </ul>
    </section>

    <section class="cat__panel">
      <h2 class="cat__list-title">Listado</h2>
      <app-data-table
        [columns]="columns"
        [rows]="tableRows"
        [page]="page"
        [pageSize]="pageSize"
        [clientFilter]="true"
        [filterableColumnsInputs]="true"
        [searchableInputMain]="['nombre']"
        [exportLabel]="''"
        emptyMessage="Sin resultados para el filtro."
        (pageChange)="onPageChange($event)"
      >
        <ng-template appDataTableColumn="estado" let-row>
          <span
            class="est__status"
            [class.est__status--review]="row['estado'] === 'REVIEW'"
          >
            {{ row['estado'] }}
          </span>
        </ng-template>
        <ng-template appDataTableColumn="acciones" let-row>
          <button type="button" class="est__edit" (click)="editar(row); $event.stopPropagation()">
            Editar
          </button>
        </ng-template>
      </app-data-table>
    </section>
  </div>
</div>
