<div class="ae__familia" *ngIf="row">
  <p class="ae__familia-note">
    Códigos de la estación: {{ row.codigosEstacion.join(', ') || '—' }}.
    <span *ngIf="row.secuenciaEsperada as seq">
      Secuencia {{ seq.minimo }}–{{ seq.maximo }}
      <ng-container *ngIf="seq.faltantes.length"> · falta {{ seq.faltantes.join(', ') }}</ng-container>
    </span>
  </p>
  <p class="ae__error" *ngIf="confirmError" role="alert">{{ confirmError }}</p>
  <app-data-table
    [columns]="columns"
    [rows]="tableRows"
    [total]="tableRows.length"
    [page]="1"
    [pageSize]="tableRows.length || 1"
    [clientFilter]="false"
    [exportEnabled]="false"
  >
    <ng-template appDataTableColumn="codigo" let-r>{{ r['codigo'] }}</ng-template>
    <ng-template appDataTableColumn="fuente" let-r>{{ r['fuente'] }}</ng-template>
    <ng-template appDataTableColumn="acciones" let-r>
      <button type="button" class="ae__casos-btn" (click)="$event.stopPropagation(); verCasos.emit(row)">
        Ver casos
      </button>
    </ng-template>
  </app-data-table>
  <label class="ae__field">
    <span>Observación</span>
    <textarea rows="2" [(ngModel)]="observacion" [disabled]="saving"></textarea>
  </label>
  <div class="ae__estado-btns" role="group" aria-label="Estado">
    <button
      type="button"
      *ngFor="let opt of estadoOptions"
      class="ae__btn"
      [class.ae__btn--primary]="selected === opt.id"
      [disabled]="saving"
      (click)="selected = opt.id"
    >
      {{ opt.label }}
    </button>
  </div>
  <footer class="ae__familia-actions">
    <button type="button" class="ae__btn" [disabled]="saving || row.estado !== 'REQUIERE_CORRECCION'" (click)="corregir.emit(row)">
      Corregir con preview
    </button>
    <button type="button" class="ae__btn ae__btn--primary" [disabled]="saving || !selected" (click)="onConfirm()">
      Asignar estado
    </button>
  </footer>
</div>
